name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main, splash-build]

jobs:
  build:
    runs-on: macos-14        # Apple Silicon (arm64), same as M1/M2/M3 Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pillow pyinstaller
      - name: Build the program (single file, runs in Terminal)
        run: |
          pyinstaller --noconfirm --onefile --console --name ResolveSplashPatcher \
            --add-data "ui.html:." splash_patcher.py
      - name: Smoke test
        run: dist/ResolveSplashPatcher --inspect
      - name: Package
        run: |
          mkdir ResolveSplashPatcher-mac
          cp dist/ResolveSplashPatcher Abrir.command ResolveSplashPatcher-mac/
          chmod +x ResolveSplashPatcher-mac/*
          ditto -c -k --keepParent ResolveSplashPatcher-mac ResolveSplashPatcher-mac-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ResolveSplashPatcher-mac-app
          path: ResolveSplashPatcher-mac-app.zip
