name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main, splash-build]

jobs:
  build:
    runs-on: macos-14        # Apple Silicon (arm64), same as M1/M2/M3 Macs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install pillow pyinstaller
      - name: Build the program (single file)
        run: |
          pyinstaller --noconfirm --onefile --console --name ResolveSplashPatcher \
            --add-data "ui.html:." splash_patcher.py
      - name: Smoke test
        run: dist/ResolveSplashPatcher --inspect
      - name: Build the app (no Terminal)
        run: |
          APP="dist/Resolve Splash Patcher.app"
          osacompile -s -o "$APP" launcher.applescript
          cp dist/ResolveSplashPatcher "$APP/Contents/Resources/ResolveSplashPatcher"
          chmod +x "$APP/Contents/Resources/ResolveSplashPatcher"
          # icon (best effort)
          python make_icon.py icon.iconset || true
          if [ -f icon.iconset/icon_1024.png ]; then
            mkdir AppIcon.iconset
            for s in 16 32 128 256 512; do
              cp icon.iconset/icon_$s.png AppIcon.iconset/icon_${s}x${s}.png
            done
            cp icon.iconset/icon_32.png AppIcon.iconset/icon_16x16@2x.png
            cp icon.iconset/icon_64.png AppIcon.iconset/icon_32x32@2x.png
            cp icon.iconset/icon_256.png AppIcon.iconset/icon_128x128@2x.png
            cp icon.iconset/icon_512.png AppIcon.iconset/icon_256x256@2x.png
            cp icon.iconset/icon_1024.png AppIcon.iconset/icon_512x512@2x.png
            iconutil -c icns AppIcon.iconset -o AppIcon.icns && cp AppIcon.icns "$APP/Contents/Resources/applet.icns" || true
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Resolve Splash Patcher'" "$APP/Contents/Info.plist" || true
          codesign --force --deep --sign - "$APP"
      - name: Package
        run: |
          mkdir out
          cp -R "dist/Resolve Splash Patcher.app" out/
          mkdir "out/Version con Terminal"
          cp dist/ResolveSplashPatcher Abrir.command "out/Version con Terminal/"
          chmod +x out/"Version con Terminal"/*
          ditto -c -k --keepParent out ResolveSplashPatcher-mac-app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ResolveSplashPatcher-mac-app
          path: ResolveSplashPatcher-mac-app.zip
